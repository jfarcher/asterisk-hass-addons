; Note: this file has been modified from the Asterisk defaults for the add-on

[general]
static=yes

[default]
exten => 444,1,Park(,s)
exten => 555,1,ParkedCall(default,701)
; Included contexts are searched in order: outside-line rules from the web UI
; are checked before the catch-all that rings internal phones.
include => parkedcalls
include => ui-outbound
include => local-extensions

[local-extensions]
exten => _X!,1,Set(DIAL_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
same => n,GotoIf($[${ISNULL(${DIAL_CONTACTS})}]?dial_endpoint:dial_contacts)
same => n(dial_contacts),Dial(${DIAL_CONTACTS},30)
same => n,Hangup()
same => n(dial_endpoint),Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

[parkedcallstimeout]
exten => s,1,Hangup()

; Outside-line routing managed by the web UI
#include extensions_ui.conf
